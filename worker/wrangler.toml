name = "total-tossup-live"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The channel's live coordinator. One instance per channel (looked up by
# name, e.g. idFromName("main")) — going from one channel to many later is
# just addressing more instances, not an architecture change.
[[durable_objects.bindings]]
name = "CHANNEL"
class_name = "ChannelDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelDurableObject"]

